name: Build PIXNET Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project source
        run: |
          cat \
            .ci/source.part00 \
            .ci/source.part01 \
            .ci/source.part02 \
            .ci/source.part03 \
            .ci/source.part04a \
            .ci/source.part04b \
            .ci/source.part05 \
            .ci/source.part06 \
            .ci/source.part07 > pixnet-source.b64
          test "$(wc -c < pixnet-source.b64)" -eq 42812
          base64 -d pixnet-source.b64 > pixnet-source.zip
          unzip -q pixnet-source.zip
          test -f pixnet-tracker-app/settings.gradle.kts

      - name: Apply current source overrides
        run: |
          cp .ci/overrides/BusinessModels.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/model/BusinessModels.kt
          cp .ci/overrides/PixnetViewModel.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/PixnetViewModel.kt
          cp .ci/overrides/AttendanceScreen.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/AttendanceScreen.kt
          cp .ci/overrides/app-build.gradle.kts pixnet-tracker-app/app/build.gradle.kts
          printf '\n*.jks\n*.keystore\n' >> pixnet-tracker-app/.gitignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare permanent signing key
        env:
          PIXNET_KEYSTORE_BASE64: ${{ secrets.PIXNET_KEYSTORE_BASE64 }}
          PIXNET_KEYSTORE_PASSWORD: ${{ secrets.PIXNET_KEYSTORE_PASSWORD }}
          PIXNET_KEY_ALIAS: ${{ secrets.PIXNET_KEY_ALIAS }}
          PIXNET_KEY_PASSWORD: ${{ secrets.PIXNET_KEY_PASSWORD }}
        run: |
          test -n "$PIXNET_KEYSTORE_BASE64" || (echo "Missing PIXNET_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$PIXNET_KEYSTORE_PASSWORD" || (echo "Missing PIXNET_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$PIXNET_KEY_ALIAS" || (echo "Missing PIXNET_KEY_ALIAS secret" && exit 1)
          test -n "$PIXNET_KEY_PASSWORD" || (echo "Missing PIXNET_KEY_PASSWORD secret" && exit 1)
          echo "$PIXNET_KEYSTORE_BASE64" | base64 --decode > pixnet-tracker-app/app/pixnet-release.jks
          chmod 600 pixnet-tracker-app/app/pixnet-release.jks

      - name: Build permanently signed release APK
        working-directory: pixnet-tracker-app
        env:
          PIXNET_KEYSTORE_PATH: ${{ github.workspace }}/pixnet-tracker-app/app/pixnet-release.jks
          PIXNET_KEYSTORE_PASSWORD: ${{ secrets.PIXNET_KEYSTORE_PASSWORD }}
          PIXNET_KEY_ALIAS: ${{ secrets.PIXNET_KEY_ALIAS }}
          PIXNET_KEY_PASSWORD: ${{ secrets.PIXNET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs pixnet-tracker-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXNET-Tracker-release-signed
          path: pixnet-tracker-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
