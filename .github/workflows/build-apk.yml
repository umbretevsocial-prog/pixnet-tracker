name: Build PIXNET Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project source
        run: |
          cat \
            .ci/source.part00 \
            .ci/source.part01 \
            .ci/source.part02 \
            .ci/source.part03 \
            .ci/source.part04a \
            .ci/source.part04b \
            .ci/source.part05 \
            .ci/source.part06 \
            .ci/source.part07 > pixnet-source.b64
          test "$(wc -c < pixnet-source.b64)" -eq 42812
          base64 -d pixnet-source.b64 > pixnet-source.zip
          unzip -q pixnet-source.zip
          test -f pixnet-tracker-app/settings.gradle.kts

      - name: Apply current source overrides
        run: |
          cp .ci/overrides/BusinessModels.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/model/BusinessModels.kt
          cp .ci/overrides/PixnetViewModel.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/PixnetViewModel.kt
          cp .ci/overrides/AttendanceScreen.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/AttendanceScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: pixnet-tracker-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXNET-Tracker-debug
          path: pixnet-tracker-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
