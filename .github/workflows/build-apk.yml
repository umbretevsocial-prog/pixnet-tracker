name: Build PIXNET Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project source
        run: |
          cat \
            .ci/source.part00 \
            .ci/source.part01 \
            .ci/source.part02 \
            .ci/source.part03 \
            .ci/source.part04a \
            .ci/source.part04b \
            .ci/source.part05 \
            .ci/source.part06 \
            .ci/source.part07 > pixnet-source.b64
          test "$(wc -c < pixnet-source.b64)" -eq 42812
          base64 -d pixnet-source.b64 > pixnet-source.zip
          unzip -q pixnet-source.zip
          test -f pixnet-tracker-app/settings.gradle.kts

      - name: Apply current source overrides
        run: |
          cp .ci/overrides/BusinessModels.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/model/BusinessModels.kt
          cp .ci/overrides/PixnetViewModel.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/PixnetViewModel.kt
          cp .ci/overrides/AttendanceScreen.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/AttendanceScreen.kt
          cp .ci/overrides/ExpensesScreen.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/ExpensesScreen.kt
          cp .ci/overrides/PayrollReceiptUtils.kt pixnet-tracker-app/app/src/main/java/com/pixnet/tracker/ui/PayrollReceiptUtils.kt
          cp .ci/overrides/AndroidManifest.xml pixnet-tracker-app/app/src/main/AndroidManifest.xml
          mkdir -p pixnet-tracker-app/app/src/main/res/xml
          cp .ci/overrides/file_paths.xml pixnet-tracker-app/app/src/main/res/xml/file_paths.xml
          cp .ci/overrides/app-build.gradle.kts pixnet-tracker-app/app/build.gradle.kts
          python .ci/patches/v1.1.3_receipt_days.py
          printf '\n*.jks\n*.keystore\n' >> pixnet-tracker-app/.gitignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare and validate permanent signing key
        env:
          PIXNET_KEYSTORE_BASE64_RAW: ${{ secrets.PIXNET_KEYSTORE_BASE64 }}
          PIXNET_KEYSTORE_PASSWORD_RAW: ${{ secrets.PIXNET_KEYSTORE_PASSWORD }}
          PIXNET_KEY_PASSWORD_RAW: ${{ secrets.PIXNET_KEY_PASSWORD }}
        run: |
          test -n "$PIXNET_KEYSTORE_BASE64_RAW" || (echo "Missing PIXNET_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$PIXNET_KEYSTORE_PASSWORD_RAW" || (echo "Missing PIXNET_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$PIXNET_KEY_PASSWORD_RAW" || (echo "Missing PIXNET_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$PIXNET_KEYSTORE_BASE64_RAW" | tr -d '\r\n ' | base64 --decode > pixnet-tracker-app/app/pixnet-release.jks
          chmod 600 pixnet-tracker-app/app/pixnet-release.jks
          STORE_PASSWORD="$(printf '%s' "$PIXNET_KEYSTORE_PASSWORD_RAW" | tr -d '\r\n')"
          keytool -list -keystore pixnet-tracker-app/app/pixnet-release.jks -storepass "$STORE_PASSWORD" -alias pixnet_release >/dev/null
          echo "Permanent signing key validated successfully."

      - name: Build permanently signed release APK
        working-directory: pixnet-tracker-app
        env:
          PIXNET_KEYSTORE_PATH: ${{ github.workspace }}/pixnet-tracker-app/app/pixnet-release.jks
          PIXNET_KEYSTORE_PASSWORD_RAW: ${{ secrets.PIXNET_KEYSTORE_PASSWORD }}
          PIXNET_KEY_PASSWORD_RAW: ${{ secrets.PIXNET_KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="$(printf '%s' "$PIXNET_KEYSTORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$PIXNET_KEY_PASSWORD_RAW" | tr -d '\r\n')"
          PIXNET_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          PIXNET_KEY_ALIAS="pixnet_release" \
          PIXNET_KEY_PASSWORD="$KEY_PASSWORD" \
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs pixnet-tracker-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXNET-Tracker-v1.1.3-release-signed
          path: pixnet-tracker-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
